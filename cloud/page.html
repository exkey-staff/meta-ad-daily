<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>バナーの効き方</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Roboto+Mono:wght@500;700&display=swap">
<style>
:root{--paper:#F7F8FA;--card:#FFF;--ink:#16202B;--ink-soft:#5A6675;--line:#DDE3EA;
 --accent:#14284B;--accent-soft:#E7ECF4;--mark:#F07A12;--ok:#1C7A4B;--mid:#A8700A;--bad:#BC2E24;
 --sans:"Noto Sans JP",system-ui,sans-serif;--mono:"Roboto Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root{--paper:#11161C;--card:#192028;--ink:#E7EDF4;--ink-soft:#97A4B4;
 --line:#2C3843;--accent:#9FBCE6;--accent-soft:#1E2A3C;--mark:#F59B4B;--ok:#59C98C;--mid:#DEAF4B;--bad:#F0766A;color-scheme:dark}}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.6;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:22px 16px 64px}
h1{font-size:clamp(1.2rem,1rem+1vw,1.55rem);margin:0 0 3px;font-weight:700}
.meta{color:var(--ink-soft);font-size:.82rem;margin:0}
.gate{max-width:380px;margin:14vh auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px}
.gate h1{font-size:1.1rem;margin:0 0 4px}.gate p{font-size:.82rem;color:var(--ink-soft);margin:0 0 16px}
.gate input{width:100%;padding:10px 12px;font:400 1rem var(--sans);border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
.gate button{width:100%;margin-top:10px;padding:10px;border:0;border-radius:8px;background:var(--accent);color:#fff;font:700 .95rem var(--sans);cursor:pointer}
.gate .err{color:var(--bad);font-size:.82rem;margin-top:10px;min-height:1.2em}
.bar{position:sticky;top:0;z-index:6;background:var(--paper);padding:10px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line)}
select,input[type=date],.btn{font:500 .82rem var(--sans);background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:7px 12px;cursor:pointer}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--card);border-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;color:var(--ink);font:500 .82rem var(--sans);padding:7px 13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.lp{margin-top:24px}
.lphead{display:flex;gap:10px 14px;align-items:baseline;flex-wrap:wrap;padding-bottom:7px;border-bottom:2px solid var(--line)}
.lphead .u{font-weight:700;font-size:.93rem;word-break:break-all}
.lphead .acc{font-size:.73rem;color:var(--ink-soft)}
.lphead .sum{font:500 .78rem var(--mono);color:var(--ink-soft);white-space:nowrap}
.lphead .go{margin-left:auto}
.go{border:1px solid var(--mark);background:var(--mark);color:#fff;border-radius:999px;
 padding:6px 14px;font:700 .8rem var(--sans);cursor:pointer;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(186px,1fr));gap:13px;margin-top:13px}
.b{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.b.win{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok) inset}
.b.lose{border-color:var(--bad)}
.b img{width:100%;display:block;aspect-ratio:1;object-fit:cover;background:var(--accent-soft)}
.b .noimg{aspect-ratio:1;display:grid;place-items:center;color:var(--ink-soft);font-size:.74rem;background:var(--accent-soft)}
.b .body{padding:9px 10px 11px}
.b .nm{font-size:.76rem;font-weight:500;word-break:break-word;margin-bottom:6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:1px 8px;font-size:.74rem;margin:0}
.kv dt{color:var(--ink-soft)}
.kv dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.tag{display:inline-block;font:500 .68rem/1.5 var(--sans);padding:1px 7px;border-radius:4px;margin-top:7px}
.tag.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.tag.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.tag.mid{background:color-mix(in srgb,var(--mid) 18%,transparent);color:var(--mid)}
.tag.mute{background:var(--accent-soft);color:var(--ink-soft)}
.b a{display:block;font-size:.72rem;margin-top:7px}
.rep{margin-top:12px;background:var(--card);border:1px solid var(--mark);border-radius:10px;padding:14px 16px}
.rep h3{margin:0 0 8px;font-size:.9rem}
.rep pre{white-space:pre-wrap;word-break:break-word;font:400 .84rem/1.75 var(--sans);margin:0}
.rep .act{margin-top:10px;display:flex;gap:8px}
.note{color:var(--ink-soft);font-size:.78rem;margin:10px 0 0}
a{color:var(--accent)}
</style></head><body>
<div id="gate" class="gate">
  <h1>バナーの効き方</h1><p>中身はパスワードで暗号化されています。</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="パスワード">
  <button id="go">開く</button><div class="err" id="err"></div>
</div>
<div class="wrap" id="app" hidden></div>
<script id="enc" type="application/json">__ENC__</script>
<script>
const ENC = JSON.parse(document.getElementById('enc').textContent);
function b64(s){                     // 8MBを1バイトずつ変換すると固まるので、まとめて書く
  const bin = atob(s), n = bin.length, a = new Uint8Array(n);
  for (let i = 0; i < n; i++) a[i] = bin.charCodeAt(i);
  return a;
}
const yen = v => v==null?'—':Math.round(v).toLocaleString('ja-JP')+'円';
const esc = s => (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let D=null, acc='all', only=false, days=14, from=null, to=null, reports={};

async function decrypt(pw){
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(ENC.salt),iterations:ENC.iter,hash:'SHA-256'},
    km, {name:'AES-GCM',length:256}, false, ['decrypt']);
  return JSON.parse(new TextDecoder().decode(
    await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC.iv)}, key, b64(ENC.data))));
}

/* 選んだ期間で足し直す */
function range(){
  if (from && to) return [from, to];
  const u = D.until, d = new Date(u+'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() - (days-1));
  return [d.toISOString().slice(0,10), u];
}
function sum(ad, a, b){
  let c=0,i=0,k=0,v=0;
  for (const [day,x] of Object.entries(ad.d)) if (day>=a && day<=b){c+=x[0];i+=x[1];k+=x[2];v+=x[3];}
  return {cost:c, imp:i, click:k, cv:v, ctr: i? k/i*100 : 0, cpa: v? c/v : null};
}
function lpTotals(lp, a, b){
  const t = {cost:0,imp:0,click:0,cv:0};
  for (const ad of lp.ads){ const s=sum(ad,a,b); t.cost+=s.cost; t.imp+=s.imp; t.click+=s.click; t.cv+=s.cv; }
  t.ctr = t.imp? t.click/t.imp*100 : 0; t.cpa = t.cv? t.cost/t.cv : null;
  return t;
}
function judge(s, t){
  const share = t.cost ? s.cost/t.cost : 0;
  if (s.cv > 0 && t.cpa && s.cpa <= t.cpa) return ['ok','効いている'];
  if (s.cv > 0) return ['mid','獲得はあるが平均より高い'];
  if (share < 0.08 || s.click < 30) return ['mute','配信が少なく判断できない'];
  if (s.ctr >= t.ctr) return ['bad','クリックは取れているがCV0'];
  return ['bad','クリックもCVも取れていない'];
}

/* 数字から文章を組み立てる。推測は書かず、数字で言えることだけ */
function analyze(lp, accName){
  const [a,b] = range();
  const t = lpTotals(lp,a,b);
  const rows = lp.ads.map(ad => ({ad, s:sum(ad,a,b)})).filter(x=>x.s.cost>0)
                     .sort((x,y)=>y.s.cost-x.s.cost);
  if (!rows.length) return 'この期間に配信がありません。';
  const L = [];
  L.push(`【${accName}】${lp.url}`);
  L.push(`期間 ${a} 〜 ${b}`);
  L.push('');
  L.push(`全体：消化 ${yen(t.cost)} / 表示 ${t.imp.toLocaleString()} / クリック ${t.click.toLocaleString()}`
    + ` / CTR ${t.ctr.toFixed(2)}% / CV ${t.cv}件` + (t.cpa?` / CPA ${yen(t.cpa)}`:' / CPA —'));
  L.push('');
  const win = rows.filter(x=>judge(x.s,t)[0]==='ok');
  const bad = rows.filter(x=>judge(x.s,t)[0]==='bad');
  const thin = rows.filter(x=>judge(x.s,t)[0]==='mute');
  if (win.length){
    L.push('■ 効いているバナー');
    for (const x of win) L.push(`・${x.ad.name}：CPA ${yen(x.s.cpa)}（CV ${x.s.cv}件 / 消化 ${yen(x.s.cost)} / CTR ${x.s.ctr.toFixed(2)}%）`);
  } else if (t.cv === 0) {
    L.push('■ この期間、獲得はゼロです。');
  } else {
    L.push('■ 平均より安く獲得できたバナーはありません。');
  }
  L.push('');
  if (bad.length){
    L.push('■ 獲得できていないバナー');
    for (const x of bad){
      const hi = x.s.ctr >= t.ctr;
      L.push(`・${x.ad.name}：消化 ${yen(x.s.cost)} / CTR ${x.s.ctr.toFixed(2)}%（全体 ${t.ctr.toFixed(2)}%）/ CV 0件`);
      if (hi) L.push('　 クリックは平均以上に取れているので、クリック後で落ちています。バナーで言っていることがLPに書かれているか確認が要ります。');
      else L.push('　 クリック自体が平均より取れていません。');
    }
    L.push('');
  }
  /* 期間を半分に割って、前半と後半を比べる */
  const mid = new Date(new Date(a+'T00:00:00Z').getTime()
    + (new Date(b+'T00:00:00Z') - new Date(a+'T00:00:00Z'))/2).toISOString().slice(0,10);
  const h1 = lpTotals(lp,a,mid), h2 = lpTotals(lp,mid,b);
  if (h1.imp > 1000 && h2.imp > 1000){
    const dc = h1.ctr ? (h2.ctr-h1.ctr)/h1.ctr*100 : 0;
    L.push('■ 期間の前半と後半');
    L.push(`・CTR ${h1.ctr.toFixed(2)}% → ${h2.ctr.toFixed(2)}%（${dc>=0?'+':''}${dc.toFixed(0)}%）`);
    L.push(`・CPA ${h1.cpa?yen(h1.cpa):'—'} → ${h2.cpa?yen(h2.cpa):'—'}`);
    if (dc <= -20) L.push('　 CTRが2割以上落ちています。同じ絵を見続けられている可能性があります。');
    L.push('');
  }
  if (thin.length){
    L.push(`■ 判断できないバナー（配信が少ない）：${thin.map(x=>x.ad.name).join('、')}`);
    L.push('');
  }
  L.push('※ この文章は数字から機械的に作っています。理由の断定はしていません。');
  return L.join('\n');
}

function card(ad, t){
  const [a,b] = range(); const s = sum(ad,a,b);
  const [cls, label] = judge(s,t);
  return '<div class="b '+(cls==='ok'?'win':(cls==='bad'?'lose':''))+'">'
    + (ad.img ? '<img src="'+ad.img+'" alt="'+esc(ad.name)+'" loading="lazy">' : '<div class="noimg">画像なし</div>')
    + '<div class="body"><div class="nm">'+esc(ad.name)+'</div>'
    + '<dl class="kv"><dt>消化</dt><dd>'+yen(s.cost)+'</dd>'
    + '<dt>CTR</dt><dd>'+(s.imp?s.ctr.toFixed(2)+'%':'—')+'</dd>'
    + '<dt>CV</dt><dd>'+s.cv+'</dd>'
    + '<dt>CPA</dt><dd>'+(s.cpa?yen(s.cpa):'—')+'</dd></dl>'
    + '<span class="tag '+cls+'">'+label+'</span>'
    + (ad.sets && ad.sets.length>1 ? '<span class="tag mute">'+ad.sets.length+'つの広告セットに同じ絵</span>' : '')
    + (ad.link ? '<a href="'+esc(ad.link)+'" target="_blank" rel="noopener">管理画面で見る</a>' : '')
    + '</div></div>';
}

function render(){
  const [a,b] = range();
  const accs = D.accounts.filter(x => acc==='all' || x.id===acc);
  let lps = [];
  for (const x of accs) for (const l of (x.lps||[])) {
    const t = lpTotals(l,a,b);
    if (t.cost >= 10000 && l.ads.some(ad=>ad.img)) lps.push({lp:l, t, accName:x.name, cvUnset:x.cvUnset, key:x.id+'|'+l.url});
  }
  if (only) lps = lps.filter(o => o.lp.ads.some(ad => judge(sum(ad,a,b), o.t)[0]==='bad'));
  lps.sort((x,y)=> y.t.cost - x.t.cost);

  document.getElementById('app').innerHTML =
    '<h1>バナーの効き方</h1>'
    + '<p class="meta">データは '+esc(D.since)+' 〜 '+esc(D.until)+' ・ 更新 '+esc(D.ranAt)+'</p>'
    + '<div class="bar">'
      + '<span class="seg">'
        + [7,14,28].map(n=>'<button data-days="'+n+'" aria-pressed="'+(!from&&days===n)+'">直近'+n+'日</button>').join('')
      + '</span>'
      + '<input type="date" id="f" value="'+a+'" min="'+esc(D.since)+'" max="'+esc(D.until)+'">'
      + '<input type="date" id="t" value="'+b+'" min="'+esc(D.since)+'" max="'+esc(D.until)+'">'
      + '<select id="acc"><option value="all">すべてのアカウント</option>'
      + D.accounts.map(x=>'<option value="'+esc(x.id)+'"'+(x.id===acc?' selected':'')+'>'+esc(x.name)+'</option>').join('')
      + '</select>'
      + '<button class="btn" id="only" aria-pressed="'+only+'">効いていない枚だけ</button>'
      + '<span class="meta">LP '+lps.length+'本</span>'
    + '</div>'
    + (lps.length ? lps.map(o =>
        '<section class="lp"><div class="lphead">'
        + '<span class="u">'+esc(o.lp.url)+'</span><span class="acc">'+esc(o.accName)+'</span>'
        + '<span class="sum">消化'+yen(o.t.cost)+' ・ CTR'+o.t.ctr.toFixed(2)+'% ・ CV'
        + (o.cvUnset?'未設定':o.t.cv)+(o.t.cpa?' ・ CPA'+yen(o.t.cpa):'')+'</span>'
        + '<button class="go" data-key="'+esc(o.key)+'">このLPを分析する</button></div>'
        + (reports[o.key] ? '<div class="rep"><h3>分析（'+a+' 〜 '+b+'）</h3><pre>'+esc(reports[o.key])+'</pre>'
            + '<div class="act"><button class="btn" data-copy="'+esc(o.key)+'">コピー</button>'
            + '<button class="btn" data-close="'+esc(o.key)+'">閉じる</button></div></div>' : '')
        + '<div class="grid">'+o.lp.ads.map(ad=>card(ad,o.t)).join('')+'</div></section>').join('')
      : '<p class="note">この期間に表示できるバナーがありません。</p>')
    + '<p class="note">「効いている」はLP平均CPAより安く獲得できた枚。'
    + '「クリックは取れているがCV0」は平均以上のCTRでクリックを集めながら獲得ゼロの枚。'
    + '消化がLPの8%未満、またはクリック30未満の枚は判断材料が足りないので判定しません。</p>';

  document.querySelectorAll('.seg button').forEach(bn => bn.addEventListener('click', () => {
    days = +bn.dataset.days; from = to = null; reports = {}; render();
  }));
  document.getElementById('f').addEventListener('change', e => { from = e.target.value; to = to || b; reports={}; render(); });
  document.getElementById('t').addEventListener('change', e => { to = e.target.value; from = from || a; reports={}; render(); });
  document.getElementById('acc').addEventListener('change', e => { acc = e.target.value; render(); });
  document.getElementById('only').addEventListener('click', () => { only = !only; render(); });
  document.querySelectorAll('.go').forEach(bn => bn.addEventListener('click', () => {
    const o = lps.find(x => x.key === bn.dataset.key);
    reports[bn.dataset.key] = analyze(o.lp, o.accName);
    render();
  }));
  document.querySelectorAll('[data-copy]').forEach(bn => bn.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(reports[bn.dataset.copy]); bn.textContent='コピーした'; }
    catch(e){ bn.textContent='コピーできません'; }
  }));
  document.querySelectorAll('[data-close]').forEach(bn => bn.addEventListener('click', () => {
    delete reports[bn.dataset.close]; render();
  }));
}

async function tryOpen(){
  const pw = document.getElementById('pw').value, err = document.getElementById('err');
  if (!pw) { err.textContent='パスワードを入れてください'; return; }
  err.textContent='開いています… 画像が多いので少しかかります';
  await new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));
  try {
    D = await decrypt(pw);
    try{sessionStorage.setItem('adpw',pw);}catch(e){}
    err.textContent='表示しています…';
    await new Promise(r => setTimeout(r, 0));
    render();
  } catch(e){
    err.textContent = (e && e.name === 'OperationError')
      ? 'パスワードが違います' : '開けませんでした（' + (e && e.message || e) + '）';
  }
}
document.getElementById('go').addEventListener('click', tryOpen);
document.getElementById('pw').addEventListener('keydown', e => { if(e.key==='Enter') tryOpen(); });
(async () => {
  let s=null; try{s=sessionStorage.getItem('adpw');}catch(e){}
  if(s){ try{ D=await decrypt(s); render(); }catch(e){} }
  document.getElementById('pw').focus();
})();
</script></body></html>
